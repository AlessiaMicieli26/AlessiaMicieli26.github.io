name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Resolve GitHub Pages base path and URL
        id: pages_env
        shell: bash
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER_LOWER="${OWNER,,}"
          REPO="${{ github.event.repository.name }}"
          REPO_LOWER="${REPO,,}"

          if [ -n "${{ vars.NEXT_PUBLIC_BASE_PATH }}" ]; then
            BASE_PATH="${{ vars.NEXT_PUBLIC_BASE_PATH }}"
          elif [ "$REPO_LOWER" = "${OWNER_LOWER}.github.io" ]; then
            BASE_PATH=""
          else
            BASE_PATH="/${REPO}"
          fi

          if [ -n "${{ vars.NEXT_PUBLIC_SITE_URL }}" ]; then
            SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL }}"
          else
            SITE_URL="https://${OWNER_LOWER}.github.io${BASE_PATH}"
          fi

          echo "base_path=${BASE_PATH}" >> "$GITHUB_OUTPUT"
          echo "site_url=${SITE_URL}" >> "$GITHUB_OUTPUT"

      - name: Build static export (out/)
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages_env.outputs.site_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages_env.outputs.base_path }}
        run: npm run build:static

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
